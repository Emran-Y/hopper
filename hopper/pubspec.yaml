name: hopper
description: Offline, wireless clipboard that hops between your phone and PC. No internet, no account, end-to-end encrypted.
publish_to: 'none'
version: 0.2.4+3003

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.7.0
  cbor: ^6.3.0
  bonsoir: ^5.1.10
  path_provider: ^2.1.4
  provider: ^6.1.2
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  pasteboard: ^0.3.0
  tray_manager: ^0.4.0
  window_manager: ^0.4.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
